# Verifies the Graft records on every pull request: each commit that changed
# behavior must carry evidence that meets .graft/policy.json, and the recorded
# commands are re-run on the merge commit, so a [pass] is a fact, not a claim.
name: Graft check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole branch, so base..HEAD is available
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The policy's e2e command is re-run here, so it needs a browser.
      - run: npx playwright install --with-deps chromium
      - uses: FourShore/Graft@v0.2.0
